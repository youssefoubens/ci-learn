name: CI


on:
  push:
    branches: [main]
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CI script
        run: ./scripts/ci.sh

      - name: create docker image 
        run: docker build -t ci-learn:${{ github.sha}} .

      - name: Run container
        run: docker run --rm ci-learn:${{ github.sha}}

