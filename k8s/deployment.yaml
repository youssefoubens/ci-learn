


apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-learn
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: ci-learn
  
  template:
    metadata:
      labels:
        app: ci-learn
    
    spec:
      containers:
        - name: web
          image: ghcr.io/youssefoubens/ci-learn:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
           httpGet:
             path: /health
             port: 3000
